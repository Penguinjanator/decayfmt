[package]
name = "decayfmt"
version = "0.1.1"
edition = "2021"
description = "A file format where decay is a first-class property. Every open permanently corrupts the file."
license = "MIT"
repository = "https://github.com/aravpanwar/decayfmt"
readme = "README.md"
keywords = ["file-format", "corruption", "decay", "cli", "entropy"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["assets/", ".github/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm",
    "qoi", "tga", "tiff", "webp",
] }
rand = "0.8"
rayon = "1"

[profile.release]
strip = true

[[bench]]
name = "corrupt"
harness = false

[[bench]]
name = "encode"
harness = false

[workspace]
members = ["python"]
default-members = ["."]
resolver = "2"
